spring.application.name=civic-issue-management

server.port=${PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/civic_issue_management}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
app.email.enabled=${EMAIL_ENABLED:false}
app.authority.email=${AUTHORITY_EMAIL:authority@civiccare.com}
app.authority.password=${AUTHORITY_PASSWORD:}
